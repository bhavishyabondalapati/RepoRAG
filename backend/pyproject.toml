[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reporag"
version = "0.1.0"
description = "Ask grounded, cited questions about any public GitHub repository."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bhavishya Bondalapati" }]

[tool.setuptools.packages.find]
include = ["reporag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
