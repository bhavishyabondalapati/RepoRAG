services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - reporag-data:/data # cloned repos + indexes survive restarts
      - model-cache:/models # embedding and reranker weights, downloaded once
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000 # the browser talks to the backend directly
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  reporag-data:
  model-cache:
